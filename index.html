<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "Microsoft YaHei", sans-serif; background:#f0f2f5; color:#333; }
.sidebar {

    background:#0D1B3E; color:#fff; padding:20px 0; overflow-y:auto;
}
.sidebar h2 { text-align:center; font-size:16px; padding:10px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
.sidebar .city-list { list-style:none; padding:10px 0; }
.sidebar .city-list li {
    padding:10px 24px; cursor:pointer; transition:0.2s; font-size:14px;
}
.sidebar .city-list li:hover { background:rgba(255,255,255,0.1); }
.sidebar .city-list li.active { background:#C5963A; color:#0D1B3E; font-weight:bold; }
.main { margin-left:200px; padding:20px 30px; }
.tabs {
    display:flex; gap:0; border-bottom:2px solid #0D1B3E; margin-bottom:24px;
}
.tabs button {
    padding:12px 24px; border:none; background:#e8eaf0; cursor:pointer;
    font-size:14px; font-family:inherit; transition:0.2s; border-radius:8px 8px 0 0;
}
.tabs button.active { background:#0D1B3E; color:#fff; font-weight:bold; }
.tabs button:hover:not(.active) { background:#d0d3dc; }
.panel { display:none; }
.panel.active { display:block; }
.card {
    background:#fff; border-radius:12px; padding:20px; margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.card h3 { font-size:15px; color:#0D1B3E; margin-bottom:16px; border-left:4px solid #C5963A; padding-left:10px; }
.kpi-row { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.kpi-box {
    flex:1; min-width:140px; background:linear-gradient(135deg,#0D1B3E,#1a2d5a);
    color:#fff; border-radius:10px; padding:16px; text-align:center;
}
.kpi-box .label { font-size:12px; opacity:0.8; margin-bottom:6px; }
.kpi-box .value { font-size:24px; font-weight:bold; color:#C5963A; }
.kpi-box .sub { font-size:11px; margin-top:4px; }
.up { color:#4caf50; }
.down { color:#f44336; }
.flat { color:#ff9800; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#0D1B3E; color:#fff; padding:10px 8px; text-align:center; font-weight:normal; }
td { padding:8px; text-align:center; border-bottom:1px solid #eee; }
tr:hover td { background:#f5f6fa; }
.chart-container { position:relative; height:320px; margin:10px 0; }
.arrow { font-size:14px; font-weight:bold; }
.section-title { font-size:18px; color:#0D1B3E; margin:20px 0 12px; font-weight:bold; }
.filter-bar { margin-bottom:16px; display:flex; gap:10px; align-items:center; }
.filter-bar select { padding:6px 12px; border-radius:6px; border:1px solid #ccc; font-family:inherit; }

#pw-overlay {
    position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:99999;
    background:linear-gradient(135deg,#0D1B3E 0%,#1a2d5a 50%,#0D1B3E 100%);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
}
#pw-overlay.hidden { display:none; }
#pw-box {
    background:#fff; border-radius:16px; padding:40px 36px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.3); max-width:380px; width:90%;
}
#pw-box h2 { color:#0D1B3E; font-size:20px; margin-bottom:8px; }
#pw-box p { color:#888; font-size:13px; margin-bottom:24px; }
#username-input, #pw-input {
    width:100%; padding:12px 16px; border:2px solid #ddd; border-radius:8px;
    font-size:16px; text-align:center; outline:none; transition:0.3s; box-sizing:border-box;
    margin-bottom:12px;
}
#username-input:focus, #pw-input:focus { border-color:#C5963A; }
#pw-input.error { border-color:#f44336; animation:shake 0.3s; }
#pw-btn {
    width:100%; padding:12px; margin-top:8px; border:none; border-radius:8px;
    background:#C5963A; color:#fff; font-size:16px; font-weight:bold;

        </div>
    </div>

    <!-- Tab 2: 运力分层 -->
    <div class="panel" id="panel2">

            </div>
            <div class="card" style="flex:1;min-width:300px;">

                <div class="chart-container"><canvas id="chart2b"></canvas></div>
            </div>
        </div>
        <div class="card">

            <div id="table2"></div>
        </div>
    </div>

    <!-- Tab 3: 运力新增与流失 -->
    <div class="panel" id="panel3">

        </div>

            <div id="table3b" style="max-height:500px;overflow-y:auto;"></div>
        </div>
    </div>

    <!-- Tab 4: 运力公司统计 -->
    <div class="panel" id="panel4">
        <div class="card">

        </div>
    </div>

    <!-- Tab 5: 时段分析 -->

        </div>
        <div class="card">

            <div id="table5"></div>
        </div>
    </div>
</div>

function arrow(v) {
    if(v===null||v===undefined) return '<span class="flat">-</span>';
    if(v>0) return '<span class="arrow up">↑'+v+'%</span>';
    if(v<0) return '<span class="arrow down">↓'+Math.abs(v)+'%</span>';
    return '<span class="arrow flat">→0%</span>';
}
