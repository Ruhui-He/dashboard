let curCity = D.cities[0];

Chart.register(ChartDataLabels);

// ===== 初始化城市列表 =====
const cityUl = document.getElementById('cityList');
D.cities.forEach((c,i) => {
    const li = document.createElement('li');
    li.textContent = c;
    if(i===0) li.className='active';

    cityUl.appendChild(li);

// ===== Tab 切换 =====
function switchTab(idx) {
    document.querySelectorAll('.tabs button').forEach((b,i) => b.classList.toggle('active', i===idx));
    document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

// ===== 渲染 =====
function render() {
    renderTab0();
    renderTab1();
    renderTab2();
    renderTab3();
    renderTab4();
}

function arrow(v) {
    if(v===null||v===undefined) return '<span class="flat">-</span>';
    if(v>0) return '<span class="arrow up">↑'+v+'%</span>';
    if(v<0) return '<span class="arrow down">↓'+Math.abs(v)+'%</span>';
    return '<span class="arrow flat">→0%</span>';
}

// ===== Tab 0: 品类日度 =====
function renderTab0() {
    const data = D.catDaily[curCity];
    if(!data||!data.length) return;
    const latest = data[data.length-1];
    // KPI - 带日环比+周环比
    let kpi = '<div class="kpi-box"><div class="label">最新日期</div><div class="value">'+latest.date+'</div></div>';
    kpi += '<div class="kpi-box"><div class="label">当日完单</div><div class="value">'+latest.total.toLocaleString()+'</div><div class="sub">日'+arrow(latest.dod)+' 周'+arrow(latest.wow)+'</div></div>';
    D.categories.forEach(cat => {
        kpi += '<div class="kpi-box"><div class="label">'+cat+'</div><div class="value">'+latest[cat].toLocaleString()+'</div><div class="sub">'+latest[cat+"_pct"]+'%</div></div>';
    });
    document.getElementById('kpi0').innerHTML = kpi;

    // 折线图 - 带数据标签
    if(charts.c0a) charts.c0a.destroy();
    const colors = ['#C5963A','#0D1B3E','#4caf50','#f44336','#2196f3','#9c27b0','#ff9800'];
    const datasets = D.categories.map((cat,i) => ({
        label: cat,
        data: data.map(r => r[cat]),
        borderColor: colors[i],
        backgroundColor: colors[i]+'22',
        tension: 0.3, fill: false, pointRadius: 3, pointHoverRadius: 5,
        datalabels: {
            align: 'top', anchor: 'end', offset: -2,
            color: colors[i], font: { size:10, weight:'bold' },
            formatter: v => v > 0 ? v.toLocaleString() : '',
            display: function(ctx) { return ctx.dataIndex === data.length - 1; }
        },
    }));
    charts.c0a = new Chart(document.getElementById('chart0a'), {
        type:'line',
        data:{ labels:data.map(r=>r.date.slice(5)), datasets },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' }, datalabels:{ display: true } }, scales:{ y:{ beginAtZero:true } } }
    });

    // 饼图 - 带数据标签(数量+百分比)
    if(charts.c0b) charts.c0b.destroy();
    const pieData = D.categories.map(c=>latest[c]);
    const pieTotal = pieData.reduce((a,b)=>a+b, 0);
    charts.c0b = new Chart(document.getElementById('chart0b'), {
        type:'doughnut',
        data:{ labels:D.categories, datasets:[{ data:pieData, backgroundColor:colors }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{
            legend:{ position:'right' },
            datalabels:{
                color:'#fff', font:{ size:11, weight:'bold' },
                formatter: (v, ctx) => {
                    if(v === 0) return '';
                    const pct = (v/pieTotal*100).toFixed(1);
                    return v.toLocaleString()+'\n'+pct+'%';
                },
                textAlign: 'center',
            }
        } }
    });

    // 明细表 - 增加周环比列
    let t = '<table><tr><th>日期</th>';
    D.categories.forEach(c => t += '<th>'+c+'<br>数量</th><th>占比</th>');
    t += '<th>合计</th><th>日环比</th><th>周环比</th></tr>';
    data.forEach(r => {
        t += '<tr><td>'+r.date.slice(5)+'</td>';
        D.categories.forEach(c => t += '<td>'+r[c].toLocaleString()+'</td><td>'+r[c+"_pct"]+'%</td>');
        t += '<td><b>'+r.total.toLocaleString()+'</b></td><td>'+arrow(r.dod)+'</td><td>'+arrow(r.wow)+'</td></tr>';
    });
    t += '</table>';
    document.getElementById('table0').innerHTML = t;
}

    const workFare = tiers.map(t => { const r=data.find(x=>x.tier===t&&x.day_type==='工作日'); return r?r.fare:0; });
    const restFare = tiers.map(t => { const r=data.find(x=>x.tier===t&&x.day_type==='休息日'); return r?r.fare:0; });
    charts.c1 = new Chart(document.getElementById('chart1'), {

        options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } }, plugins:{ datalabels:{ display:true } } }
    });

    let kpi = '<div class="kpi-box"><div class="label">流失司机总数</div><div class="value" style="color:#f44336">'+totalChurned+'</div></div>';
    kpi += '<div class="kpi-box"><div class="label">总司机数</div><div class="value">'+totalDrivers+'</div></div>';

    document.getElementById('kpi3').innerHTML = kpi;

    // 汇总表
    let t = '<table><tr><th>分层</th><th>流失人数</th><th>该分层总人数</th><th>流失率</th><th>历史日均完单</th><th>历史总完单</th></tr>';
    data.forEach(r => {

    if(!data) return;

    let t = '<table><tr><th>运力公司</th><th>司机数</th><th>总完单量</th><th>日均完单量</th><th>流失司机数</th><th>流失率</th></tr>';
    data.forEach(r => {
        const rateClass = r.churn_rate > 50 ? 'down' : r.churn_rate > 30 ? 'flat' : 'up';
        t += '<tr><td style="text-align:left;padding-left:8px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="'+r.company+'">'+r.company+'</td>';
        t += '<td>'+r.drivers+'</td>';
        t += '<td><b>'+r.total_orders.toLocaleString()+'</b></td>';
        t += '<td>'+r.avg_daily_orders+'</td>';
        t += '<td style="color:#f44336;font-weight:bold">'+r.churned+'</td>';
        t += '<td class="'+rateClass+'">'+r.churn_rate+'%</td></tr>';
    });
    t += '</table>';
    document.getElementById('table4').innerHTML = t;
}

function exportCSV() {
    const detail = D.churnDetail.filter(d=>d.city===curCity);
    let csv = '\uFEFF司机编号,运力公司,运力分层,出车天数,总完单量,日均完单量,最后完单日期\n';
    detail.forEach(r => csv += '"'+r.id+'","'+(r.company||'')+'","'+r.tier+'",'+r.days+','+r.total+','+r.avg+','+r.last+'\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = curCity+'_流失司机明细.csv';
    a.click();
}

render();
</script>
