let curCity = D.cities[0];
let charts = {};
Chart.register(ChartDataLabels);

// ===== 初始化城市列表 =====
const cityUl = document.getElementById('cityList');
D.cities.forEach((c,i) => {
    const li = document.createElement('li');
    li.textContent = c;
    if(i===0) li.className='active';
    li.onclick = () => { document.querySelectorAll('.city-list li').forEach(x=>x.classList.remove('active')); li.classList.add('active'); curCity=c; render(); };
    cityUl.appendChild(li);
});

// ===== Tab 切换 =====
function switchTab(idx) {
    document.querySelectorAll('.tabs button').forEach((b,i) => b.classList.toggle('active', i===idx));
    document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

// ===== 渲染 =====
function render() {
    // 数据截止日期格式化
    var d = new Date(D.dates[D.dates.length - 1]);
    var dateStr = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
    document.getElementById('cutoffDate').textContent = dateStr;
    // 更新各板块标题加日期
    var h3Map = {
        'h3_0a': '各品类日度完单量趋势',
        'h3_0b': '品类占比',
        'h3_0c': '日度明细数据',
        'h3_1a': '全品类 - 单司比 & 客单价',
        'h3_1b': '特惠单 - 单司比 & 客单价',
        'h3_1c': '各分层单司比对比',
        'h3_2a': '司机占比',
        'h3_2b': '完单占比',
        'h3_2c': '分层指标明细',
        'h3_3a': '各分层流失统计',
        'h3_3b': '流失司机明细',
        'h3_4a': '各运力公司统计'
    };
    for(var id in h3Map) {
        var el = document.getElementById(id);
        if(el) {
            var base = h3Map[id];
            var btn = el.querySelector('button');
            var btnHtml = btn ? btn.outerHTML : '';
            el.innerHTML = base + '（数据截至 ' + dateStr + '）' + btnHtml;
        }
    }
    // 车队看板标题用车队表自己的日期
    var fData = D.fleetStats[curCity];
    if(fData && fData.date) {
        var fd = new Date(fData.date);
        var fStr = fd.getFullYear() + '年' + (fd.getMonth()+1) + '月' + fd.getDate() + '日';
        ['h3_5a','h3_5b'].forEach(function(id){
            var el = document.getElementById(id);
            if(el) el.innerHTML = el.getAttribute('data-base') + '（' + fStr + '）';
        });
    }
    renderTab0();
    renderTab1();
    renderTab2();
    renderTab3();
    renderTab4();
    renderTab5();
}

function arrow(v) {
    if(v===null||v===undefined) return '<span class="flat">-</span>';
    if(v>0) return '<span class="arrow up">↑'+v+'%</span>';
    if(v<0) return '<span class="arrow down">↓'+Math.abs(v)+'%</span>';
    return '<span class="arrow flat">→0%</span>';
}

// ===== Tab 0: 品类日度 =====
function renderTab0() {
    const data = D.catDaily[curCity];
    if(!data||!data.length) return;
    const latest = data[data.length-1];
    // KPI - 带日环比+周环比
    let kpi = '<div class="kpi-box"><div class="label">最新日期</div><div class="value">'+latest.date+'</div></div>';
    kpi += '<div class="kpi-box"><div class="label">当日完单</div><div class="value">'+latest.total.toLocaleString()+'</div><div class="sub">日'+arrow(latest.dod)+' 周'+arrow(latest.wow)+'</div></div>';
    D.categories.forEach(cat => {
        kpi += '<div class="kpi-box"><div class="label">'+cat+'</div><div class="value">'+latest[cat].toLocaleString()+'</div><div class="sub">'+latest[cat+"_pct"]+'%</div></div>';
    });
    document.getElementById('kpi0').innerHTML = kpi;

    // 折线图 - 带数据标签
    if(charts.c0a) charts.c0a.destroy();
    const colors = ['#C5963A','#0D1B3E','#4caf50','#f44336','#2196f3','#9c27b0','#ff9800'];
    const datasets = D.categories.map((cat,i) => ({
        label: cat,
        data: data.map(r => r[cat]),
        borderColor: colors[i],
        backgroundColor: colors[i]+'22',
        tension: 0.3, fill: false, pointRadius: 3, pointHoverRadius: 5,
        datalabels: {
            align: 'top', anchor: 'end', offset: -2,
            color: colors[i], font: { size:10, weight:'bold' },
            formatter: v => v > 0 ? v.toLocaleString() : '',
            display: function(ctx) { return ctx.dataIndex === data.length - 1; }
        },
    }));
    charts.c0a = new Chart(document.getElementById('chart0a'), {
        type:'line',
        data:{ labels:data.map(r=>r.date.slice(5)), datasets },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'top' }, datalabels:{ display: true } }, scales:{ y:{ beginAtZero:true } } }
    });

    // 饼图 - 带数据标签(数量+百分比)
    if(charts.c0b) charts.c0b.destroy();
    const pieData = D.categories.map(c=>latest[c]);
    const pieTotal = pieData.reduce((a,b)=>a+b, 0);
    charts.c0b = new Chart(document.getElementById('chart0b'), {
        type:'doughnut',
        data:{ labels:D.categories, datasets:[{ data:pieData, backgroundColor:colors }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{
            legend:{ position:'right' },
            datalabels:{
                color:'#fff', font:{ size:11, weight:'bold' },
                formatter: (v, ctx) => {
                    if(v === 0) return '';
                    const pct = (v/pieTotal*100).toFixed(1);
                    return v.toLocaleString()+'\n'+pct+'%';
                },
                textAlign: 'center',
            }
        } }
    });

    // 明细表 - 增加周环比列
    let t = '<table><tr><th>日期</th>';
    D.categories.forEach(c => t += '<th>'+c+'<br>数量</th><th>占比</th>');
    t += '<th>合计</th><th>日环比</th><th>周环比</th></tr>';
    data.forEach(r => {
        t += '<tr><td>'+r.date.slice(5)+'</td>';
        D.categories.forEach(c => t += '<td>'+r[c].toLocaleString()+'</td><td>'+r[c+"_pct"]+'%</td>');
        t += '<td><b>'+r.total.toLocaleString()+'</b></td><td>'+arrow(r.dod)+'</td><td>'+arrow(r.wow)+'</td></tr>';
    });
    t += '</table>';
    document.getElementById('table0').innerHTML = t;
}

// ===== Tab 1: 工作日/休息日 =====
function renderTab1() {
    const data = D.tierDay[curCity];
    if(!data) return;
    // 城市整体指标 KPI
    var overall = D.cityDailyOverall[curCity];
    if(overall && overall.length) {

        var kpi1 = '<div class="kpi-box"><div class="label">城市整体 · 单司比</div><div class="value">'+lat.ratio+'</div><div class="sub">日'+arrow(lat.ratio_dod)+' 周'+arrow(lat.ratio_wow)+'</div></div>';

        kpi1 += '<div class="kpi-box"><div class="label">当日完单量</div><div class="value">'+lat.orders.toLocaleString()+'</div></div>';

    const restRatio = tiers.map(t => { const r=data.find(x=>x.tier===t&&x.day_type==='休息日'); return r?r.ratio:0; });
    const workFare = tiers.map(t => { const r=data.find(x=>x.tier===t&&x.day_type==='工作日'); return r?r.fare:0; });
    const restFare = tiers.map(t => { const r=data.find(x=>x.tier===t&&x.day_type==='休息日'); return r?r.fare:0; });
    charts.c1 = new Chart(document.getElementById('chart1'), {
        type:'bar',
        data:{ labels:tiers, datasets:[
            { label:'工作日-单司比', data:workRatio, backgroundColor:'#0D1B3E',
               datalabels:{ anchor:'end', align:'top', color:'#0D1B3E', font:{size:11,weight:'bold'}, formatter:v=>v } },
            { label:'休息日-单司比', data:restRatio, backgroundColor:'#C5963A',
               datalabels:{ anchor:'end', align:'top', color:'#C5963A', font:{size:11,weight:'bold'}, formatter:v=>v } },
        ] },
        options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{ beginAtZero:true } }, plugins:{ datalabels:{ display:true } } }

}

    // 完单占比饼图

    const c2bData = data.rows.map(r=>r.total_orders);
    const c2bTotal = c2bData.reduce((a,b)=>a+b, 0);
    charts.c2b = new Chart(document.getElementById('chart2b'), {
        type:'doughnut',
        data:{ labels:data.rows.map(r=>r.tier), datasets:[{ data:c2bData, backgroundColor:colors }] },
        options:{ responsive:true, maintainAspectRatio:false, plugins:{
            legend:{ position:'right' },
            datalabels:{
                color:'#fff', font:{ size:11, weight:'bold' },
                formatter: (v, ctx) => {
                    if(v === 0) return '';
                    const pct = (v/c2bTotal*100).toFixed(1);
                    return v.toLocaleString()+'\n'+pct+'%';
                },
                textAlign: 'center',
            }
        } }
    });

    // 明细表 - 增加完单占比列
    let t = '<table><tr><th>分层</th><th>司机数</th><th>司机占比</th><th>总完单</th><th>完单占比</th><th>人均日完单</th><th>人均时长(min)</th><th>单均实付</th><th>单均优惠</th><th>客单价</th></tr>';

        t += '<tr><td><b>'+r.tier+'</b></td><td>'+r.count+'</td><td>'+r.pct+'%</td><td>'+r.total_orders.toLocaleString()+'</td><td><b>'+r.order_share+'%</b></td><td>'+r.avg_daily+'</td><td>'+r.avg_duration+'</td><td>'+r.avg_fare+'</td><td>'+r.avg_discount+'</td><td>'+r.avg_ticket+'</td></tr>';
    });
    t += '</table>';
    document.getElementById('table2').innerHTML = t;
}

        t += '<td>'+r.ratio+'</td>';
        t += '<td style="color:#4caf50;font-weight:bold">'+r.new_drivers+'</td>';

function exportCSV() {
    const detail = D.churnDetail.filter(d=>d.city===curCity);
    let csv = '\uFEFF司机编号,运力公司,运力分层,出车天数,总完单量,日均完单量,最后完单日期\n';
    detail.forEach(r => csv += '"'+r.id+'","'+(r.company||'')+'","'+r.tier+'",'+r.days+','+r.total+','+r.avg+','+r.last+'\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = curCity+'_流失司机明细.csv';
    a.click();
}

(async function(){
    var USERS = {"taoyq": "b762c280c5bfbd21e0c401f0a1b79a4e7de64a70102306cd886577a1020eb277", "hej": "a6af319b47f472fe6f6135c4d86567e3d7b35891de3988a898b2a3f5359703cb", "herh": "f9ac6d3c89a4ff7428a7e3811dfcbcadbc045c3c180b0e16db7da6b172449415", "wangyy": "9aeac80337577e3e6c2e78e6420132ce61d2fc4753dfa77a4710fda4b423d38a", "zhanggq": "c3d90ae32da8ec4923bd984d867459a0848681cb84f9bebd799b7db4a886cef8"};
    async function sha256(msg) {
        var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
        return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
    }
    window.pwCheck = async function() {
        var username = document.getElementById("username-input").value.trim();
        var password = document.getElementById("pw-input").value;
        var err = document.getElementById("pw-err");
        if(!username || !password) {
            err.style.display = "block";
            err.textContent = "请输入用户名和密码";
            return;
        }
        var hash = await sha256(username + ":" + password);
        if(USERS[username] && USERS[username] === hash) {
            document.getElementById("pw-overlay").classList.add("hidden");
            try { sessionStorage.setItem("pw_ok","1"); sessionStorage.setItem("username", username); } catch(e) {}
        } else {
            document.getElementById("pw-input").classList.add("error");
            err.style.display = "block";
            err.textContent = "用户名或密码错误，请重新输入";
            setTimeout(function(){ document.getElementById("pw-input").classList.remove("error"); }, 500);
        }
    };
    try {
        if(sessionStorage.getItem("pw_ok") === "1") {
            document.getElementById("pw-overlay").classList.add("hidden");
        }
    } catch(e) {}
    document.addEventListener("keydown", function(e) {
        if(e.key === "Enter" && !document.getElementById("pw-overlay").classList.contains("hidden")) {
            window.pwCheck();
        }
    });
})();
