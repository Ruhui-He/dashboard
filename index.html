<style>

.sidebar .city-list li {

.main { margin-left:200px; padding:20px 30px; }
.tabs {

.tabs button {

}
.tabs button.active { background:#0D1B3E; color:#fff; font-weight:bold; }
.tabs button:hover:not(.active) { background:#d0d3dc; }
.panel { display:none; }
.panel.active { display:block; }
.card {
    background:#fff; border-radius:12px; padding:20px; margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
}
.card h3 { font-size:15px; color:#0D1B3E; margin-bottom:16px; border-left:4px solid #C5963A; padding-left:10px; }
.kpi-row { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.kpi-box {
    flex:1; min-width:140px; background:linear-gradient(135deg,#0D1B3E,#1a2d5a);
    color:#fff; border-radius:10px; padding:16px; text-align:center;
}
.kpi-box .label { font-size:12px; opacity:0.8; margin-bottom:6px; }
.kpi-box .value { font-size:24px; font-weight:bold; color:#C5963A; }
.kpi-box .sub { font-size:11px; margin-top:4px; }
.up { color:#4caf50; }
.down { color:#f44336; }
.flat { color:#ff9800; }
table { width:100%; border-collapse:collapse; font-size:13px; }
th { background:#0D1B3E; color:#fff; padding:10px 8px; text-align:center; font-weight:normal; }

// ===== 初始化城市列表 =====
const cityUl = document.getElementById('cityList');
D.cities.forEach((c,i) => {
    const li = document.createElement('li');
    li.textContent = c;
    if(i===0) li.className='active';
    li.onclick = () => { document.querySelectorAll('.city-list li').forEach(x=>x.classList.remove('active')); li.classList.add('active'); curCity=c; render(); };
    cityUl.appendChild(li);
});

// ===== Tab 切换 =====
function switchTab(idx) {
    document.querySelectorAll('.tabs button').forEach((b,i) => b.classList.toggle('active', i===idx));
    document.querySelectorAll('.panel').forEach((p,i) => p.classList.toggle('active', i===idx));
}

// ===== 渲染 =====
function render() {
    // 数据截止日期格式化
    var d = new Date(D.dates[D.dates.length - 1]);
    var dateStr = d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
    document.getElementById('cutoffDate').textContent = dateStr;
    // 更新各板块标题加日期
    var h3Map = {
        'h3_0a': '各品类日度完单量趋势',
        'h3_0b': '品类占比',
        'h3_0c': '日度明细数据',
        'h3_1a': '全品类 - 单司比 & 客单价',
        'h3_1b': '特惠单 - 单司比 & 客单价',
        'h3_1c': '各分层单司比对比',
        'h3_2a': '司机占比',
        'h3_2b': '完单占比',
        'h3_2c': '分层指标明细',
        'h3_3a': '各分层流失统计',
        'h3_3b': '流失司机明细',
        'h3_4a': '各运力公司统计'
    };
    for(var id in h3Map) {
        var el = document.getElementById(id);
        if(el) {
            var base = h3Map[id];
            var btn = el.querySelector('button');
            var btnHtml = btn ? btn.outerHTML : '';
            el.innerHTML = base + '（数据截至 ' + dateStr + '）' + btnHtml;
        }
    }
    renderTab0();
    renderTab1();
    renderTab2();
    renderTab3();
    renderTab4();
}

function arrow(v) {
    if(v===null||v===undefined) return '<span class="flat">-</span>';
    if(v>0) return '<span class="arrow up">↑'+v+'%</span>';
    if(v<0) return '<span class="arrow down">↓'+Math.abs(v)+'%</span>';
    return '<span class="arrow flat">→0%</span>';
}

    async function sha256(msg) {
        var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(msg));
        return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,"0")}).join("");
    }
    window.pwCheck = async function() {
        var username = document.getElementById("username-input").value.trim();
        var password = document.getElementById("pw-input").value;
        var err = document.getElementById("pw-err");
        if(!username || !password) {
            err.style.display = "block";
            err.textContent = "请输入用户名和密码";
            return;
        }
        var hash = await sha256(username + ":" + password);
        if(USERS[username] && USERS[username] === hash) {
            document.getElementById("pw-overlay").classList.add("hidden");
            try { sessionStorage.setItem("pw_ok","1"); sessionStorage.setItem("username", username); } catch(e) {}
        } else {
            document.getElementById("pw-input").classList.add("error");
            err.style.display = "block";
            err.textContent = "用户名或密码错误，请重新输入";
            setTimeout(function(){ document.getElementById("pw-input").classList.remove("error"); }, 500);
        }
    };
    try {
        if(sessionStorage.getItem("pw_ok") === "1") {
            document.getElementById("pw-overlay").classList.add("hidden");
        }
    } catch(e) {}
    document.addEventListener("keydown", function(e) {
        if(e.key === "Enter" && !document.getElementById("pw-overlay").classList.contains("hidden")) {
            window.pwCheck();
        }
    });
})();
